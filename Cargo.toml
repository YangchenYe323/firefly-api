[package]
name = "firefly-api"
version = "0.1.0"
edition = "2021"
authors = ["Yangchen Ye <eikasia30@gmail.com>"]

[package.metadata.cargo-shear]
# axum-cloudflare-adapter macros uses these crates
ignored = ["wasm-bindgen-futures", "oneshot"]

[package.metadata.release]
release = false

# https://github.com/rustwasm/wasm-pack/issues/1247
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.5.0", features = ['http', 'axum'] }
axum = { version = "0.8.4", default-features = false, features = ["json", "macros", "query"] }
tower-service = "0.3.3"
console_error_panic_hook = { version = "0.1.7" }
rspotify = "0.14.0"
serde = { version = "1.0.219", features = ["derive"] }
axum-cloudflare-adapter = "0.14.0"
wasm-bindgen-futures = "0.4.50"
oneshot = "0.1.11"
reqwest = { version = "0.12.22", features = ["json", "stream"] }
http = "1.3.1"
serde_json = "1.0.140"
anyhow = "1.0.98"
base64 = "0.22.1"
futures = "0.3.31"
md5 = "0.8.0"
dotenv = "0.15.0"
bitflag = "0.10.1"
bitflags = { version = "2.9.1", features = ["serde"] }
instant = { version = "0.1.13", features = ["wasm-bindgen"] }
serde_repr = "0.1.20"
web-sys = "0.3.77"
jiff = "0.2.15"
tracing = "0.1.41"
tracing-web = "0.1.3"
tracing-subscriber = { version = "0.3.19", features = ["time", "json"] }
time = { version = "0.3.41", features = ["wasm-bindgen"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.50"

# optimize for code size
[profile.release]
lto = true
strip = true
codegen-units = 1
